name: Deploy WiFiMap pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        env:
          WIFIMAP_API_URL: ${{ vars.WIFIMAP_API_URL }}
        run: |
          mkdir _site
          cp index.html simulador.html _site/
          python - <<'PY'
          import json
          import os
          with open("_site/api-config.js", "w", encoding="utf-8") as config:
              config.write(f"window.WIFI_SIMULATOR_API = {json.dumps(os.environ.get('WIFIMAP_API_URL', ''))};\n")
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
